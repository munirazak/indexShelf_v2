# Default local port. On GCP Cloud Run, Google sets PORT (usually 8080) — that overrides this.
server.port=${PORT:8080}
spring.application.name=indexShelf
# Local default. For GCP / Docker prod, set SPRING_PROFILES_ACTIVE=prod (env overrides this).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

bookmanagement.base-url=${BOOKMANAGEMENT_BASE_URL:http://localhost:8081}
# Must match BookManagement app.internal-api-key / INTERNAL_API_KEY
bookmanagement.internal-api-key=${INTERNAL_API_KEY:indexShelf-to-bookmanagement-internal-key-change-me}
usermanagement.base-url=${USERMANAGEMENT_BASE_URL:http://localhost:8082}

logging.level.root=INFO
logging.level.com.kopibru=INFO
