services:
  postgres:
    image: postgres:16-alpine
    container_name: indexShelf-db
    environment:
      POSTGRES_DB: book_catalogue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Unique host port so this stack can run beside BookManagement / UserManagement
      - "5435:5432"
    volumes:
      - indexShelf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_catalogue"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indexShelf-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Override: SPRING_PROFILES_ACTIVE=prod docker compose up --build
      # Or set SPRING_PROFILES_ACTIVE in a local .env file (default: dev).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: "8080"
      JWT_SECRET: indexShelf-jwt-secret-key-32chars-min
      JWT_EXPIRATION_MS: "3600000"
      BOOKMANAGEMENT_BASE_URL: http://host.docker.internal:8081
      USERMANAGEMENT_BASE_URL: http://host.docker.internal:8082
      # Must match BookManagement INTERNAL_API_KEY
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-indexShelf-to-bookmanagement-internal-key-change-me}

volumes:
  indexShelf_pg_data:
